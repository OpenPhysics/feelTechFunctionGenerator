name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The protocol encoder is pure string building, so the whole command set is
      # tested here with no instrument attached.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
